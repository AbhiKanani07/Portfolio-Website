name: Sync Roblox data

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm run roblox
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_USER: ${{ vars.ROBLOX_USER }}

      - name: Commit the snapshot if it changed
        run: |
          git config user.name "roblox-sync"
          git config user.email "actions@users.noreply.github.com"
          git add docs/roblox.json
          git diff --cached --quiet || (git commit -m "Sync Roblox data" && git push)
