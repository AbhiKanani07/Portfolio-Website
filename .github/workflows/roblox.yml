name: Sync Roblox library
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/roblox-sync.mjs
        env:
          ROBLOX_USER: ${{ vars.ROBLOX_USER }}
      - name: Commit the snapshot if it changed
        run: |
          git config user.name "roblox-sync"
          git config user.email "actions@users.noreply.github.com"
          git add docs/roblox.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Sync Roblox library" && git push)
